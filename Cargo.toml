[package]
name = "cc-audit"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
askama = "0.13"
rust-embed = "8"
anyhow = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
